# CI — the OS matrix that proves the two promises on every platform (Idea §11).
#
# The full suite (unit + property + golden + contract + integration + MCP) runs
# on Linux, macOS, and Windows; a determinism job asserts byte-identical reports
# across two runs; and the criterion benches guard the per-stage budget shape.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (unit + property + golden + contract + integration + MCP)
        run: cargo test --workspace

  embeddings:
    name: real-ONNX embeddings (the ignored test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cache the downloaded all-MiniLM-L6-v2 model (~90 MB) so steady-state runs
      # never re-fetch it from HuggingFace. fastembed's default cache dir is
      # `.fastembed_cache` under the crate the test runs in.
      - name: Restore the ONNX model cache
        id: onnx-cache
        uses: actions/cache/restore@v4
        with:
          path: crates/commenter-cat-engine/.fastembed_cache
          key: fastembed-${{ runner.os }}-all-minilm-l6-v2-v1
      # This job exercises the REAL model end to end (CLAUDE.md keeps the test
      # #[ignore]d so the default suite stays offline/fast). The model fetch is
      # the only flaky part, so we retry ONLY a transient HuggingFace fetch
      # error — a genuine assertion failure (dimensions, determinism, cosine
      # ordering) fails the build on the first attempt and is never masked.
      - name: Run the real-embedding test (retry transient model fetches only)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            out="$(cargo test -p commenter-cat-engine -- --ignored 2>&1)"; code=$?
            echo "$out"
            [ "$code" -eq 0 ] && exit 0
            if echo "$out" | grep -q "loading ONNX embedding model"; then
              echo "::warning::transient ONNX model fetch failed (attempt ${attempt}/3) — retrying"
              sleep "$((attempt * 20))"
            else
              echo "::error::real-ONNX embedding test failed (not a model-fetch error) — failing the build"
              exit "$code"
            fi
          done
          echo "::error::could not fetch the ONNX model after 3 attempts (HuggingFace unreachable)"
          exit 1
      # Persist the model only on success and only when we actually fetched it,
      # so a partial or corrupt download is never written to the cache.
      - name: Save the ONNX model cache
        if: success() && steps.onnx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: crates/commenter-cat-engine/.fastembed_cache
          key: ${{ steps.onnx-cache.outputs.cache-primary-key }}

  reproducibility:
    name: reproducibility (byte-identical report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the commenter-cat binary
        run: cargo build --release -p commenter-cat-cli
      - name: Two runs over an identical tree must be byte-identical
        shell: bash
        run: |
          set -euo pipefail
          # Same (tree_hash, commenter_cat_ruleset_version, provider_version, config_hash)
          # → identical canonical JSONL. `|| true` tolerates a findings exit code.
          ./target/release/commenter-cat check crates --format jsonl > run1.jsonl || true
          ./target/release/commenter-cat check crates --format jsonl > run2.jsonl || true
          if ! diff -u run1.jsonl run2.jsonl; then
            echo "::error::reports are not byte-identical across runs (determinism broken)"
            exit 1
          fi

  bench:
    name: perf benches (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native-pass benches
        # Short measurement in CI — this guards against gross regressions, not
        # micro-noise; the budget shape (§6) is the signal.
        run: cargo bench -p commenter-cat-engine --bench native_pass -- --warm-up-time 1 --measurement-time 3
